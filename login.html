<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login | East Bengal eFootball Club</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Teko:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        :root {
            --bg-dark: #0a0a0c;
            --bg-card: #121318;
            --primary-red: #e50914;
            --primary-red-hover: #b80710;
            --accent-gold: #ffb703;
            --text-light: #ffffff;
            --text-muted: #9a9caf;
            --border-color: #22242d;
            --glow-red: rgba(229, 9, 20, 0.4);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-top: 3px solid var(--primary-red);
            border-radius: 8px;
            width: 100%;
            max-width: 440px;
            padding: 35px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .login-header {
            text-align: center;
            margin-bottom: 20px;
        }

        /* CLUB LOGO STYLING */
        .brand-logo-img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border-radius: 8px;
            margin: 0 auto 12px auto;
            display: block;
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.4);
            border: 1px solid rgba(255, 183, 3, 0.3);
        }

        .login-header h1 {
            font-family: 'Teko', sans-serif;
            font-size: 36px;
            text-transform: uppercase;
            line-height: 1;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 5px;
        }

        /* LOGIN ROLE SWITCHER BUTTONS */
        .role-switch-container {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            background: #090a0c;
            padding: 5px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .role-btn {
            flex: 1;
            padding: 10px 5px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

            .role-btn:hover {
                color: var(--text-light);
            }

            .role-btn.active {
                background: var(--primary-red);
                color: #fff;
                box-shadow: 0 0 10px var(--glow-red);
            }

        .form-group {
            margin-bottom: 20px;
        }

            .form-group label {
                display: block;
                font-weight: 600;
                font-size: 14px;
                margin-bottom: 6px;
                text-transform: uppercase;
                color: var(--text-muted);
            }

        .form-control {
            width: 100%;
            background: #090a0c;
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            color: var(--text-light);
            border-radius: 4px;
            font-size: 15px;
            outline: none;
            transition: 0.3s ease;
        }

            .form-control:focus {
                border-color: var(--primary-red);
                box-shadow: 0 0 10px var(--glow-red);
            }

        .form-actions-extra {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 20px;
            color: var(--text-muted);
        }

            .form-actions-extra a {
                color: var(--primary-red);
                text-decoration: none;
                font-weight: 600;
            }

                .form-actions-extra a:hover {
                    text-decoration: underline;
                }

        .btn-submit {
            width: 100%;
            background: var(--primary-red);
            color: #fff;
            padding: 12px;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s ease;
        }

            .btn-submit:hover {
                background: var(--primary-red-hover);
                box-shadow: 0 0 15px var(--glow-red);
            }

        .bottom-register-prompt {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 14px;
        }

            .bottom-register-prompt a {
                color: var(--primary-red);
                font-weight: 700;
                text-decoration: none;
            }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
        }

            .back-link:hover {
                color: var(--primary-red);
            }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <!-- OFFICIAL CLUB LOGO -->
            <img src="Image/image1.jpg.jpg" alt="East Bengal eFootball Club Logo" class="brand-logo-img" onerror="this.onerror=null; this.src='image1.jpg.jpg';">
            <h1 id="loginTitle">Player Login</h1>
            <p id="loginSubtitle">Welcome back! Access your eFootball profile dashboard.</p>
        </div>

        <!-- ROLE SELECTION BUTTONS -->
        <div class="role-switch-container">
            <button type="button" class="role-btn active" onclick="switchRole('player')">
                <i class="fa-solid fa-gamepad"></i> Player
            </button>
            <button type="button" class="role-btn" onclick="switchRole('captain')">
                <i class="fa-solid fa-user-ninja"></i> Captain
            </button>
            <button type="button" class="role-btn" onclick="switchRole('admin')">
                <i class="fa-solid fa-user-shield"></i> Admin
            </button>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" action="player-profile.html" method="GET">
            <div class="form-group">
                <label><i class="fa-solid fa-envelope"></i> Email / User ID</label>
                <input type="email" class="form-control" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" class="form-control" placeholder="Enter password" required>
            </div>

            <div class="form-actions-extra">
                <label style="cursor: pointer;">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Login To Player Dashboard</button>
        </form>

        <div class="bottom-register-prompt">
            Don't have an account? <a href="register.html">Register Here</a>
        </div>

        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Homepage</a>
    </div>

    <!-- JAVASCRIPT FOR SWITCHING ROLES -->
    <script>
        function switchRole(role) {
            // Remove active class from all buttons
            const buttons = document.querySelectorAll('.role-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            // Elements to update dynamically
            const loginTitle = document.getElementById('loginTitle');
            const loginSubtitle = document.getElementById('loginSubtitle');
            const submitBtn = document.getElementById('submitBtn');
            const loginForm = document.getElementById('loginForm');

            // Update details based on selected role
            if (role === 'player') {
                event.currentTarget.classList.add('active');
                loginTitle.innerText = "Player Login";
                loginSubtitle.innerText = "Welcome back! Access your eFootball profile dashboard.";
                submitBtn.innerText = "Login To Player Dashboard";
                loginForm.action = "player-profile.html";
            } else if (role === 'captain') {
                event.currentTarget.classList.add('active');
                loginTitle.innerText = "Captain Login";
                loginSubtitle.innerText = "Manage your squad, lineups, and match strategy.";
                submitBtn.innerText = "Login To Captain Portal";
                loginForm.action = "captain-dashboard.html";
            } else if (role === 'admin') {
                event.currentTarget.classList.add('active');
                loginTitle.innerText = "Admin Portal Login";
                loginSubtitle.innerText = "Access EBFC administrative controls and rankings.";
                submitBtn.innerText = "Login To Admin Panel";
                loginForm.action = "admin-dashboard.html";
            }
        }
    </script>

</body>
</html>
