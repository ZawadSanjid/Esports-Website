<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile Dashboard | East Bengal eFootball Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Teko:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CROPPER.JS LIBRARY -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        :root {
            --bg-dark: #0a0a0c;
            --bg-card: #121318;
            --primary-red: #e50914;
            --accent-gold: #ffb703;
            --accent-green: #4caf50;
            --text-light: #ffffff;
            --text-muted: #9a9caf;
            --border-color: #22242d;
            --glow-red: rgba(229, 9, 20, 0.4);
            --badge-win: #2ed573;
            --badge-loss: #ff4757;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding-bottom: 60px;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(10, 10, 12, 0.95);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo .logo-img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .brand-logo .brand-name {
            font-family: 'Teko', sans-serif;
            font-size: 26px;
            text-transform: uppercase;
        }

        .brand-logo .brand-name span {
            color: var(--primary-red);
        }

        .btn-outline-sm {
            border: 1px solid var(--border-color);
            background: transparent;
            color: #fff;
            padding: 6px 16px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-gold-sm {
            border: 1px solid var(--accent-gold);
            background: rgba(255, 183, 3, 0.1);
            color: var(--accent-gold);
            padding: 6px 16px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
        }

        .dashboard-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .player-hero-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--primary-red);
            border-radius: 12px;
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .player-avatar-box {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid var(--primary-red);
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 0 20px var(--glow-red);
        }

        .player-avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .meta-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 10px;
        }

        .meta-item {
            background: #090a0c;
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .section-header {
            font-family: 'Teko', sans-serif;
            font-size: 32px;
            text-transform: uppercase;
            margin: 25px 0 15px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        /* STATS GRID CARDS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px 10px;
            text-align: center;
        }

        .stat-card .val {
            font-family: 'Teko', sans-serif;
            font-size: 32px;
            line-height: 1;
            font-weight: 700;
        }

        .stat-card .lbl {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* COMMUNITY BREAKDOWN GRID */
        .community-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
        }

        .comm-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            border-left: 3px solid var(--accent-gold);
        }

        .comm-card h4 {
            font-family: 'Teko', sans-serif;
            font-size: 22px;
            text-transform: uppercase;
            color: var(--accent-gold);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .comm-stats-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
            font-size: 12px;
        }

        .comm-stat-item {
            background: #090a0c;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .comm-stat-item strong {
            display: block;
            font-size: 16px;
            font-family: 'Teko', sans-serif;
        }

        /* MODAL STYLES */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--accent-gold);
            border-radius: 10px;
            width: 95%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 25px;
        }

        .form-grid-modal {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .form-control {
            width: 100%;
            background: #090a0c;
            border: 1px solid var(--border-color);
            padding: 10px;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
        }

        /* CROP MODAL STYLES */
        .crop-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            padding: 15px;
        }

        .crop-modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 20px;
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .crop-container {
            width: 100%;
            max-height: 300px;
            margin: 15px 0;
            overflow: hidden;
            background: #000;
        }

        .crop-container img {
            max-width: 100%;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBETAOmBVsmFiI_HvKyk7_QKDBCMNKoUL0",
            authDomain: "ebfc-portal.firebaseapp.com",
            projectId: "ebfc-portal",
            storageBucket: "ebfc-portal.firebasestorage.app",
            messagingSenderId: "93840741420",
            appId: "1:93840741420:web:05d574c95368be68e62d89",
            measurementId: "G-VBHEWLE64S"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
    </script>
</head>
<body>

    <nav class="navbar">
        <div class="brand-logo">
            <img src="Image/image1.jpg.jpg" alt="EBFC Logo" class="logo-img" onerror="this.onerror=null; this.src='image1.jpg.jpg';">
            <div class="brand-name">EB <span>FC</span></div>
        </div>
        <div>
            <a href="home.html" class="btn-outline-sm"><i class="fa-solid fa-house"></i> Home</a>
            <a href="home.html" onclick="logoutUser()" class="btn-outline-sm"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- PLAYER PROFILE HERO -->
        <div class="player-hero-card">
            <div class="player-avatar-box">
                <img id="displayAvatar" src="Image/player1.webp" alt="Avatar">
            </div>

            <div class="player-main-info">
                <h1 id="displayName">Loading Name...</h1>
                <div class="meta-tags">
                    <div class="meta-item"><i class="fa-solid fa-gamepad"></i> Game ID: <strong id="displayGameId">---</strong></div>
                    <div class="meta-item"><i class="fa-solid fa-phone"></i> Mobile: <strong id="displayPhone">N/A</strong></div>
                    <div class="meta-item"><i class="fa-brands fa-facebook"></i> FB: <a id="displayFbLink" href="#" target="_blank" style="color:var(--accent-gold);">View Profile</a></div>
                    <div class="meta-item"><i class="fa-solid fa-droplet" style="color: var(--primary-red);"></i> Blood Group: <strong id="displayBloodGroup">N/A</strong></div>
                    <div class="meta-item"><i class="fa-solid fa-mobile-screen-button"></i> Device: <strong id="displayDevice">---</strong></div>
                </div>
            </div>

            <button onclick="openEditModal()" class="btn-gold-sm" style="margin-left: auto;"><i class="fa-solid fa-pen-to-square"></i> Edit Info</button>
        </div>

        <!-- OVERALL OFFICIAL STATISTICS -->
        <div class="section-header" style="color: var(--primary-red);"><i class="fa-solid fa-trophy"></i> Overall Official Statistics</div>
        <div class="stats-grid" id="officialStatsContainer"></div>

        <!-- TARGET COMMUNITIES PERFORMANCE BREAKDOWN -->
        <div class="section-header" style="color: var(--accent-gold);"><i class="fa-solid fa-users-viewfinder"></i> Community Performance Breakdown</div>
        <div class="community-grid" id="communityStatsContainer"></div>
    </div>

    <!-- EDIT PROFILE MODAL -->
    <div id="editProfileModal" class="modal-overlay">
        <div class="modal-card">
            <h3 style="font-family:'Teko'; font-size:28px; color:var(--accent-gold); margin-bottom:15px;">EDIT PROFILE INFORMATION</h3>

            <div style="text-align:center; margin-bottom:15px;">
                <img id="edit-preview-img" src="Image/player1.webp" style="width:90px; height:90px; border-radius:50%; border:2px solid var(--accent-gold); object-fit:cover;">
                <input type="file" id="edit-player-photo" accept="image/*" style="display:none;" onchange="initEditCropper(event)">
                <br>
                <button type="button" class="btn-gold-sm" style="margin-top:8px;" onclick="document.getElementById('edit-player-photo').click()"><i class="fa-solid fa-camera"></i> Change & Adjust Photo</button>
            </div>

            <form id="editProfileForm">
                <div class="form-grid-modal">
                    <div class="form-group"><label>Player Name</label><input type="text" id="editName" class="form-control" required></div>
                    <div class="form-group"><label>Mobile Number</label><input type="tel" id="editPhone" class="form-control" pattern="[0-9]{11}" maxlength="11" minlength="11" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required></div>
                    <div class="form-group"><label>Game ID</label><input type="text" id="editGameId" class="form-control" required></div>
                    <div class="form-group"><label>FB Profile Link</label><input type="url" id="editFbLink" class="form-control" required></div>
                    <div class="form-group"><label>Device Model</label><input type="text" id="editDevice" class="form-control" required></div>
                </div>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button type="submit" id="saveBtn" class="btn-gold-sm" style="flex:1;">Save Profile Changes</button>
                    <button type="button" class="btn-outline-sm" onclick="closeEditModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- CROP MODAL -->
    <div class="crop-modal-overlay" id="cropModal">
        <div class="crop-modal-card">
            <h3 style="font-family:'Teko'; font-size:24px; color:var(--accent-gold);">CROP NEW PROFILE PHOTO</h3>
            <div class="crop-container"><img id="cropTargetImage" src=""></div>
            <div style="display:flex; gap:10px; justify-content:center;">
                <button type="button" class="btn-gold-sm" onclick="applyEditCrop()">Apply Crop</button>
                <button type="button" class="btn-outline-sm" onclick="closeCropModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let currentUserId = null;
        let currentUserData = null;
        let updatedPhotoBase64 = null;
        let cropper = null;

        const communitiesList = [
            { code: 'efob', name: 'EFOB' },
            { code: 'ecob', name: 'ECOB' },
            { code: 'easb', name: 'EASB' },
            { code: 'cobeg(main)', name: 'COBEG (Main)' },
            { code: 'cobeg(academy)', name: 'COBEG (Academy)' },
            { code: 'eaob', name: 'EAOB' },
            { code: 'pesbd', name: 'PESBD' },
            { code: 'befa', name: 'BEFA' },
            { code: 'befc', name: 'BEFC' },
            { code: 'efcob', name: 'EFCOB' },
            { code: 'ttsbd', name: 'TTSBD' },
            { code: 'gkec', name: 'GKEC' }
        ];

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUserId = user.uid;
                db.collection('users').doc(currentUserId).onSnapshot(doc => {
                    if (doc.exists) {
                        currentUserData = doc.data();
                        renderHeroData();
                        renderOfficialStats();
                        renderCommunityStats();
                    }
                });
            } else { window.location.href = "login.html"; }
        });

        function logoutUser() { auth.signOut().then(() => { window.location.href = "login.html"; }); }

        function renderHeroData() {
            document.getElementById('displayName').innerText = currentUserData.name || "EBFC Player";
            document.getElementById('displayPhone').innerText = currentUserData.phone || "N/A";
            document.getElementById('displayGameId').innerText = currentUserData.gameId || "N/A";
            document.getElementById('displayFbLink').href = currentUserData.fbLink || "#";
            document.getElementById('displayDevice').innerText = currentUserData.device || "N/A";
            document.getElementById('displayBloodGroup').innerText = currentUserData.bloodGroup || "N/A";
            if (currentUserData.avatar) document.getElementById('displayAvatar').src = currentUserData.avatar;
        }

        function renderOfficialStats() {
            const off = currentUserData.official || { mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0, winRate: "0.0", motm: 0 };
            document.getElementById('officialStatsContainer').innerHTML = `
                <div class="stat-card"><div class="val">${off.mp || 0}</div><div class="lbl">MP</div></div>
                <div class="stat-card"><div class="val" style="color:var(--badge-win)">${off.w || 0}</div><div class="lbl">Wins</div></div>
                <div class="stat-card"><div class="val" style="color:var(--accent-gold)">${off.d || 0}</div><div class="lbl">Draws</div></div>
                <div class="stat-card"><div class="val" style="color:var(--badge-loss)">${off.l || 0}</div><div class="lbl">Losses</div></div>
                <div class="stat-card"><div class="val">${off.gf || 0}</div><div class="lbl">GF</div></div>
                <div class="stat-card"><div class="val">${off.ga || 0}</div><div class="lbl">GA</div></div>
                <div class="stat-card"><div class="val" style="color:var(--accent-green)">${off.winRate || "0.0"}%</div><div class="lbl">Win Rate</div></div>
                <div class="stat-card"><div class="val" style="color:var(--accent-gold)">${off.pts || 0}</div><div class="lbl">Points</div></div>
                <div class="stat-card"><div class="val" style="color:var(--accent-gold)"><i class="fa-solid fa-star"></i> ${off.motm || 0}</div><div class="lbl">MOTM</div></div>
            `;
        }

        function renderCommunityStats() {
            const commData = currentUserData.communities || {};
            const container = document.getElementById('communityStatsContainer');
            container.innerHTML = '';

            communitiesList.forEach(c => {
                const cStats = commData[c.code] || { mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, auto: 0, pts: 0, winRate: "0.0" };
                
                container.innerHTML += `
                    <div class="comm-card">
                        <h4>${c.name} <span style="font-size:14px; color:var(--accent-gold);">${cStats.pts || 0} PTS</span></h4>
                        <div class="comm-stats-list">
                            <div class="comm-stat-item">MP<strong>${cStats.mp || 0}</strong></div>
                            <div class="comm-stat-item" style="color:var(--badge-win)">W<strong>${cStats.w || 0}</strong></div>
                            <div class="comm-stat-item" style="color:var(--accent-gold)">D<strong>${cStats.d || 0}</strong></div>
                            <div class="comm-stat-item" style="color:var(--badge-loss)">L<strong>${cStats.l || 0}</strong></div>
                            <div class="comm-stat-item">GF<strong>${cStats.gf || 0}</strong></div>
                            <div class="comm-stat-item">GA<strong>${cStats.ga || 0}</strong></div>
                            <div class="comm-stat-item" style="color:var(--accent-gold)">Auto<strong>${cStats.auto || 0}</strong></div>
                            <div class="comm-stat-item" style="color:var(--accent-green); grid-column: span 2;">Win%<strong>${cStats.winRate || "0.0"}%</strong></div>
                        </div>
                    </div>
                `;
            });
        }

        function openEditModal() {
            if (!currentUserData) return;
            document.getElementById('editName').value = currentUserData.name || '';
            document.getElementById('editPhone').value = currentUserData.phone || '';
            document.getElementById('editGameId').value = currentUserData.gameId || '';
            document.getElementById('editFbLink').value = currentUserData.fbLink || '';
            document.getElementById('editDevice').value = currentUserData.device || '';
            document.getElementById('edit-preview-img').src = currentUserData.avatar || 'Image/player1.webp';
            document.getElementById('editProfileModal').style.display = 'flex';
        }

        function closeEditModal() { document.getElementById('editProfileModal').style.display = 'none'; }

        function initEditCropper(e) {
            const files = e.target.files;
            if (files && files.length > 0) {
                const reader = new FileReader();
                reader.onload = function (event) {
                    const img = document.getElementById('cropTargetImage');
                    img.src = event.target.result;
                    document.getElementById('cropModal').style.display = 'flex';

                    if (cropper) cropper.destroy();
                    cropper = new Cropper(img, { aspectRatio: 1, viewMode: 1 });
                };
                reader.readAsDataURL(files[0]);
            }
        }

        function applyEditCrop() {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas({ width: 350, height: 350 });
            updatedPhotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
            document.getElementById('edit-preview-img').src = updatedPhotoBase64;
            closeCropModal();
        }

        function closeCropModal() {
            document.getElementById('cropModal').style.display = 'none';
            if (cropper) cropper.destroy();
        }

        document.getElementById('editProfileForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const phoneInput = document.getElementById('editPhone').value.trim();
            if (phoneInput.length !== 11) { alert("১১ ডিজিটের মোবাইল নম্বর প্রদান করুন।"); return; }

            const updatedFields = {
                name: document.getElementById('editName').value.trim(),
                phone: phoneInput,
                gameId: document.getElementById('editGameId').value.trim(),
                fbLink: document.getElementById('editFbLink').value.trim(),
                device: document.getElementById('editDevice').value.trim(),
                avatar: updatedPhotoBase64 || currentUserData.avatar || 'Image/player1.webp'
            };

            await db.collection('users').doc(currentUserId).update(updatedFields);
            closeEditModal();
            alert("Profile Information Updated!");
        });
    </script>
</body>
</html>
