<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Rankings | East Bengal eFootball Club</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Teko:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        :root {
            --bg-dark: #0a0a0c;
            --bg-card: #121318;
            --primary-red: #e50914;
            --primary-red-hover: #b80710;
            --accent-gold: #ffb703;
            --accent-green: #4caf50;
            --text-light: #ffffff;
            --text-muted: #9a9caf;
            --border-color: #22242d;
            --glow-red: rgba(229, 9, 20, 0.4);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding-bottom: 60px;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(10, 10, 12, 0.95);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

            .brand-logo .logo-img {
                width: 45px;
                height: 45px;
                object-fit: contain;
                border-radius: 6px;
                box-shadow: 0 0 12px rgba(255, 183, 3, 0.4);
            }

            .brand-logo .brand-name {
                font-family: 'Teko', sans-serif;
                font-size: 26px;
                letter-spacing: 1px;
                text-transform: uppercase;
            }

                .brand-logo .brand-name span {
                    color: var(--primary-red);
                }

        .btn-outline-sm {
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-light);
            padding: 6px 16px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s ease;
            font-size: 13px;
        }

            .btn-outline-sm:hover {
                border-color: var(--primary-red);
                color: var(--primary-red);
            }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }

            .page-header h1 {
                font-family: 'Teko', sans-serif;
                font-size: 48px;
                text-transform: uppercase;
                line-height: 1;
            }

            .page-header p {
                color: var(--text-muted);
                font-size: 16px;
            }

        /* RANKING TABS */
        .tab-navigation {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

            .tab-btn:hover {
                color: var(--text-light);
                border-color: var(--primary-red);
            }

            .tab-btn.active {
                background: var(--primary-red);
                color: #fff;
                border-color: var(--primary-red);
                box-shadow: 0 0 15px var(--glow-red);
            }

            .tab-btn.potm-btn.active {
                background: var(--accent-gold);
                color: #000;
                border-color: var(--accent-gold);
                box-shadow: 0 0 15px rgba(255, 183, 3, 0.5);
            }

        /* SEARCH & ACTIONS BAR */
        .action-bar {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-input {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            outline: none;
            width: 250px;
        }

            .search-input:focus {
                border-color: var(--primary-red);
            }

        .btn-reset-potm {
            background: rgba(229, 9, 20, 0.15);
            border: 1px solid var(--primary-red);
            color: var(--primary-red);
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            display: none; /* Only visible in POTM tab for admin */
        }

            .btn-reset-potm:hover {
                background: var(--primary-red);
                color: #fff;
            }

        /* TABLE CONTAINER */
        .table-responsive {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow-x: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .ranking-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 14px;
            min-width: 900px;
        }

            .ranking-table th {
                background: #090a0c;
                color: var(--text-muted);
                padding: 14px 10px;
                text-transform: uppercase;
                font-weight: 700;
                font-size: 12px;
                border-bottom: 2px solid var(--border-color);
            }

            .ranking-table td {
                padding: 12px 10px;
                border-bottom: 1px solid var(--border-color);
                font-weight: 600;
            }

            .ranking-table tr:hover {
                background: rgba(255, 255, 255, 0.03);
            }

        /* RANK BADGES */
        .rank-badge {
            font-family: 'Teko', sans-serif;
            font-size: 20px;
            font-weight: 700;
            width: 32px;
            height: 32px;
            line-height: 32px;
            border-radius: 50%;
            margin: 0 auto;
            display: inline-block;
        }

        .rank-1 {
            background: var(--accent-gold);
            color: #000;
        }

        .rank-2 {
            background: #c0c0c0;
            color: #000;
        }

        .rank-3 {
            background: #cd7f32;
            color: #000;
        }

        .player-cell {
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }

            .player-cell img {
                width: 32px;
                height: 32px;
                border-radius: 50%;
                object-fit: cover;
                border: 1px solid var(--primary-red);
            }

        .pts-col {
            color: var(--accent-gold);
            font-size: 16px;
            font-weight: 700;
        }

        .gd-col {
            color: var(--accent-green);
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="brand-logo">
            <img src="Image/image1.jpg.jpg" alt="EBFC Logo" class="logo-img" onerror="this.onerror=null; this.src='image1.jpg.jpg';">
            <div class="brand-name">EB <span>FC</span></div>
        </div>
        <div>
            <a href="home.html" class="btn-outline-sm"><i class="fa-solid fa-house"></i> Home</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>EBFC Leaderboards</h1>
            <p>Official Competitive Ranks, Domestic Standings & Monthly POTM Statistics</p>
        </div>

        <!-- RANKING TAB BUTTONS -->
        <div class="tab-navigation">
            <button class="tab-btn active" onclick="switchTab('official', event)">
                <i class="fa-solid fa-trophy"></i> Official Ranking
            </button>
            <button class="tab-btn" onclick="switchTab('domestic', event)">
                <i class="fa-solid fa-shield-halved"></i> Domestic Ranking
            </button>
            <button class="tab-btn potm-btn" onclick="switchTab('potm', event)">
                <i class="fa-solid fa-star"></i> POTM Ranking (Monthly)
            </button>
        </div>

        <!-- ACTION BAR: RESET & SEARCH -->
        <div class="action-bar">
            <div>
                <button id="resetPotmBtn" class="btn-reset-potm" onclick="resetPotmRanking()">
                    <i class="fa-solid fa-rotate-left"></i> Reset Monthly POTM Stats
                </button>
            </div>
            <input type="text" id="searchInput" onkeyup="filterTable()" class="search-input" placeholder="Search player by name...">
        </div>

        <!-- RANKINGS TABLE -->
        <div class="table-responsive">
            <table class="ranking-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th style="text-align: left;">Player</th>
                        <th>Club</th>
                        <th>MP</th>
                        <th>W</th>
                        <th>D</th>
                        <th>L</th>
                        <th>GF</th>
                        <th>GA</th>
                        <th>GD</th>
                        <th>Win %</th>
                        <th>Points</th>
                        <th>MOTM</th>
                    </tr>
                </thead>
                <tbody id="rankingTableBody">
                    <!-- Dynamic Rows render here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- JAVASCRIPT SYSTEM -->
    <script>
let currentTab = 'official';

function getPlayerData() {
            let savedData = localStorage.getItem('ebfc_all_players');
            if (savedData) return JSON.parse(savedData);

            // Generator for 100 initial players if first time
            let players = [];
            let defaultNames = [
                "Tawshik Ahammad Ayon", "AS Rakib", "Siam Ahmed", "Tanvir Hossain",
                "Muhammad Zahid Imam", "Arnob Ahmed", "Ayman Rahman", "Nabil Chowdhury",
                "Fahim Shahriar", "Shahriar Hasan", "Mahir Karim", "Zawadullah Bhuiyan"
            ];

            for (let i = 1; i <= 100; i++) {
                let name = defaultNames[i - 1] || `EBFC_Player_${i}`;

                let mp = Math.floor(Math.random() * 25) + 5;
                let w = Math.floor(mp * (Math.random() * 0.6 + 0.2));
                let d = Math.floor((mp - w) * 0.3);
                let l = mp - w - d;
                let gf = w * 2 + Math.floor(Math.random() * 10);
                let ga = l * 2 + Math.floor(Math.random() * 8);

                let potmMp = Math.floor(Math.random() * 6) + 1;
                let potmW = Math.floor(potmMp * 0.7);
                let potmD = 1;
                let potmL = potmMp - potmW - potmD;
                let potmGf = potmW * 2 + 2;
                let potmGa = potmL * 2;

                players.push({
                    id: i,
                    name: name,
                    club: i % 2 === 0 ? "East Bengal Main" : "East Bengal Academy",
                    avatar: `Image/player1.webp`,

                    // Overall Official Stats
                    official: {
                        mp: mp, w: w, d: d, l: l,
                        gf: gf, ga: ga, gd: gf - ga,
                        winRate: ((w / mp) * 100).toFixed(1),
                        pts: (w * 3) + d,
                        motm: Math.floor(w / 2)
                    },

                    // Domestic League Stats
                    domestic: {
                        mp: Math.floor(mp * 0.7), w: Math.floor(w * 0.7), d: Math.floor(d * 0.7), l: Math.floor(l * 0.7),
                        gf: Math.floor(gf * 0.7), ga: Math.floor(ga * 0.7), gd: Math.floor(gf * 0.7) - Math.floor(ga * 0.7),
                        winRate: ((w / mp) * 100).toFixed(1),
                        pts: (Math.floor(w * 0.7) * 3) + Math.floor(d * 0.7),
                        motm: Math.floor(w / 3)
                    },

                    // Monthly POTM Stats
                    potm: {
                        mp: potmMp, w: potmW, d: potmD, l: potmL < 0 ? 0 : potmL,
                        gf: potmGf, ga: potmGa, gd: potmGf - potmGa,
                        winRate: ((potmW / potmMp) * 100).toFixed(1),
                        pts: (potmW * 3) + potmD,
                        motm: Math.floor(potmW / 2)
                    }
                });
            }

            localStorage.setItem('ebfc_all_players', JSON.stringify(players));
            return players;
}

document.addEventListener("DOMContentLoaded", function () {
            renderTable();
            checkAdminForReset();
});

function checkAdminForReset() {
            const user = JSON.parse(localStorage.getItem('ebfc_user'));
            const resetBtn = document.getElementById('resetPotmBtn');
            if (user && user.role === 'admin' && currentTab === 'potm') {
                resetBtn.style.display = 'inline-block';
            } else {
                resetBtn.style.display = 'none';
            }
}

function switchTab(tab, event) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            checkAdminForReset();
            renderTable();
}

function renderTable() {
            let players = getPlayerData();

            // Automatic Ranking Sort (Points -> GD -> GF -> Win %)
            players.sort((a, b) => {
                let statA = a[currentTab];
                let statB = b[currentTab];

                if (statB.pts !== statA.pts) return statB.pts - statA.pts;
                if (statB.gd !== statA.gd) return statB.gd - statA.gd;
                if (statB.gf !== statA.gf) return statB.gf - statA.gf;
                return statB.winRate - statA.winRate;
            });

            const tbody = document.getElementById('rankingTableBody');
            tbody.innerHTML = '';

            players.forEach((p, index) => {
                let rank = index + 1;
                let stat = p[currentTab];
                let rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';

                tbody.innerHTML += `
                            <tr>
                                <td><span class="rank-badge ${rankClass}">${rank}</span></td>
                                <td>
                                    <div class="player-cell">
                                        <img src="${p.avatar}" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1566492031773-4f4e44671857?q=80&w=200';" alt="">
                                        <div><div style="font-weight: 700;">${p.name}</div></div>
                                    </div>
                                </td>
                                <td>${p.club}</td>
                                <td>${stat.mp}</td>
                                <td style="color: var(--accent-green);">${stat.w}</td>
                                <td style="color: var(--accent-gold);">${stat.d}</td>
                                <td style="color: var(--primary-red);">${stat.l}</td>
                                <td>${stat.gf}</td>
                                <td>${stat.ga}</td>
                                <td class="gd-col">${stat.gd > 0 ? '+' + stat.gd : stat.gd}</td>
                                <td>${isNaN(stat.winRate) ? '0.0' : stat.winRate}%</td>
                                <td class="pts-col">${stat.pts}</td>
                                <td style="color: var(--accent-gold);"><i class="fa-solid fa-star"></i> ${stat.motm}</td>
                            </tr>
                        `;
            });
}

// RESET POTM FUNCTION (WITHOUT AFFECTING OFFICIAL/DOMESTIC)
function resetPotmRanking() {
            if (confirm("Are you sure you want to Reset Monthly POTM Ranking? Official and Domestic stats will remain safe!")) {
                let players = getPlayerData();

                players.forEach(p => {
                    p.potm = {
                        mp: 0, w: 0, d: 0, l: 0,
                        gf: 0, ga: 0, gd: 0,
                        winRate: 0, pts: 0, motm: 0
                    };
                });

                localStorage.setItem('ebfc_all_players', JSON.stringify(players));
                renderTable();
                alert("Monthly POTM Ranking has been reset successfully!");
            }
}

// Live Table Filter
function filterTable() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let rows = document.querySelectorAll('#rankingTableBody tr');

            rows.forEach(row => {
                let playerName = row.cells[1].innerText.toLowerCase();
                row.style.display = playerName.includes(input) ? '' : 'none';
            });
}
    </script>
</body>
</html>
