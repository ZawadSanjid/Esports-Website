<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Squad & Players | East Bengal eFootball Club</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Teko:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        :root {
            --bg-dark: #0a0a0c;
            --bg-card: #121318;
            --bg-card-hover: #1a1c24;
            --primary-red: #e50914;
            --primary-red-hover: #b80710;
            --accent-gold: #ffb703;
            --accent-green: #2ec4b6;
            --text-light: #ffffff;
            --text-muted: #9a9caf;
            --border-color: #22242d;
            --glow-red: rgba(229, 9, 20, 0.4);
            /* MATCH RESULT BADGE COLORS */
            --badge-win: #2ed573;
            --badge-draw: #747d8c;
            --badge-loss: #ff4757;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding-bottom: 60px;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(10, 10, 12, 0.95);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

            .brand-logo .logo-img {
                width: 45px;
                height: 45px;
                object-fit: contain;
                border-radius: 6px;
                box-shadow: 0 0 12px rgba(255, 183, 3, 0.4);
            }

            .brand-logo .brand-name {
                font-family: 'Teko', sans-serif;
                font-size: 26px;
                letter-spacing: 1px;
                text-transform: uppercase;
            }

                .brand-logo .brand-name span {
                    color: var(--primary-red);
                }

        .btn-outline-sm {
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-light);
            padding: 6px 16px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s ease;
            font-size: 13px;
        }

            .btn-outline-sm:hover {
                border-color: var(--primary-red);
                color: var(--primary-red);
            }

        /* MAIN CONTAINER */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }

            .page-header h1 {
                font-family: 'Teko', sans-serif;
                font-size: 48px;
                text-transform: uppercase;
                line-height: 1;
            }

            .page-header p {
                color: var(--text-muted);
                font-size: 16px;
            }

        /* SEARCH BAR BAR & CONTROLS */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            border-radius: 8px;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

            .search-box input {
                width: 100%;
                background: #090a0c;
                border: 1px solid var(--border-color);
                padding: 10px 15px 10px 40px;
                color: var(--text-light);
                border-radius: 6px;
                font-size: 14px;
                outline: none;
                transition: 0.3s ease;
            }

                .search-box input:focus {
                    border-color: var(--primary-red);
                }

            .search-box i {
                position: absolute;
                left: 14px;
                top: 50%;
                transform: translateY(-50%);
                color: var(--text-muted);
            }

        .squad-count-tag {
            font-family: 'Teko', sans-serif;
            font-size: 20px;
            color: var(--accent-gold);
            text-transform: uppercase;
        }

        /* PLAYERS GRID CARDS LAYOUT */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 20px;
        }

        .player-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-top: 3px solid var(--primary-red);
            border-radius: 10px;
            padding: 20px;
            transition: 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

            .player-card:hover {
                transform: translateY(-5px);
                border-color: var(--primary-red);
                box-shadow: 0 10px 25px rgba(229, 9, 20, 0.25);
                background: var(--bg-card-hover);
            }

        .player-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid var(--primary-red);
            object-fit: cover;
            margin-bottom: 12px;
            box-shadow: 0 0 15px var(--glow-red);
        }

        .player-name {
            font-family: 'Teko', sans-serif;
            font-size: 26px;
            line-height: 1;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .player-role-badge {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 15px;
            background: rgba(255, 183, 3, 0.15);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
        }

        .info-list {
            width: 100%;
            text-align: left;
            margin-bottom: 15px;
            font-size: 13px;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

            .info-item span.val {
                color: var(--text-light);
                font-weight: 600;
            }

            .info-item a.fb-btn {
                color: var(--accent-gold);
                font-weight: 700;
                transition: 0.2s;
            }

                .info-item a.fb-btn:hover {
                    text-decoration: underline;
                    color: #fff;
                }

        /* RECENT MATCHES RESULTS STATUS BADGES */
        .recent-results-wrapper {
            width: 100%;
            border-top: 1px dashed var(--border-color);
            padding-top: 12px;
        }

        .results-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
        }

        .results-boxes {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .res-box {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Teko', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

            .res-box.win {
                background-color: var(--badge-win);
                color: #000;
            }

            .res-box.draw {
                background-color: var(--badge-draw);
                color: #fff;
            }

            .res-box.loss {
                background-color: var(--badge-loss);
                color: #fff;
            }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="brand-logo">
            <img src="Image/image1.jpg.jpg" alt="EBFC Logo" class="logo-img" onerror="this.onerror=null; this.src='image1.jpg.jpg';">
            <div class="brand-name">EB <span>FC</span></div>
        </div>
        <div>
            <a href="home.html" class="btn-outline-sm" style="margin-right:8px;"><i class="fa-solid fa-house"></i> Home</a>
           
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Official Registered Players</h1>
            <p>Complete Member Directory & Recent Match Form Status</p>
        </div>

        <!-- SEARCH AND FILTER CONTROLS -->
        <div class="controls-bar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" onkeyup="filterPlayers()" placeholder="Search player by name or device...">
            </div>
            <div class="squad-count-tag" id="squadCounter">Total Players: 0</div>
        </div>

        <!-- PLAYERS CARDS GRID CONTAINER -->
        <div class="players-grid" id="playersGridContainer"></div>
    </div>

    <!-- JAVASCRIPT DIRECTORY RENDERER -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            renderPlayersDirectory();
        });

        // GET REGISTERED PLAYERS FROM LOCALSTORAGE OR DEFAULT DEMO LIST
        function getRegisteredPlayers() {
            let saved = localStorage.getItem('ebfc_all_players');
            if (saved) {
                return JSON.parse(saved);
            }

            // DEFAULT INITIAL DEMO PLAYERS LIST IF EMPTY
            let defaultPlayers = [
                {
                    id: 101,
                    name: "Tawshik Ahammad Ayon",
                    gameId: "ASEZ-334-526-988",
                    fbLink: "https://facebook.com",
                    device: "Redmi Note 10",
                    role: "captain",
                    avatar: "Image/player1.webp",
                    recentForm: ['W', 'W', 'D', 'W', 'L']
                },
                {
                    id: 102,
                    name: "AS Rakib",
                    gameId: "EBFC-998-112-443",
                    fbLink: "https://facebook.com",
                    device: "Poco X3 Pro",
                    role: "player",
                    avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=300",
                    recentForm: ['W', 'W', 'W', 'D', 'W']
                },
                {
                    id: 103,
                    name: "Tanvir Hossain",
                    gameId: "EBFC-443-120-001",
                    fbLink: "https://facebook.com",
                    device: "Realme 8 Pro",
                    role: "player",
                    avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=300",
                    recentForm: ['D', 'L', 'W', 'L', 'W']
                },
                {
                    id: 104,
                    name: "Sabbir Ahmed",
                    gameId: "EBFC-771-009-882",
                    fbLink: "https://facebook.com",
                    device: "Samsung S21 FE",
                    role: "player",
                    avatar: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=300",
                    recentForm: ['W', 'L', 'D', 'D', 'L']
                }
            ];

            localStorage.setItem('ebfc_all_players', JSON.stringify(defaultPlayers));
            return defaultPlayers;
        }

        // RENDER PLAYERS INTO GRID
        function renderPlayersDirectory() {
            let players = getRegisteredPlayers();
            let container = document.getElementById('playersGridContainer');
            let counter = document.getElementById('squadCounter');

            container.innerHTML = '';
            counter.innerText = `Total Players: ${players.length}`;

            if (players.length === 0) {
                container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">No registered players found in database.</p>`;
                return;
            }

            players.forEach(p => {
                let avatarSrc = p.avatar || 'Image/player1.webp';
                let fbUrl = p.fbLink || 'https://facebook.com';
                let roleTitle = p.role ? p.role.toUpperCase() : 'PLAYER';

                // GENERATE RECENT FORM BADGES (W / D / L)
                let recentForm = p.recentForm || ['W', 'W', 'D', 'L', 'W']; // Default form if not recorded
                let formBadgesHtml = '';

                recentForm.forEach(res => {
                    let r = res.toUpperCase();
                    if (r === 'W') {
                        formBadgesHtml += `<div class="res-box win" title="Win">W</div>`;
                    } else if (r === 'D') {
                        formBadgesHtml += `<div class="res-box draw" title="Draw">D</div>`;
                    } else if (r === 'L' || r === 'R') {
                        // Supports 'L' for Loss / 'R' for Red Loss Box
                        formBadgesHtml += `<div class="res-box loss" title="Loss">L</div>`;
                    }
                });

                container.innerHTML += `
                    <div class="player-card">
                        <img src="${avatarSrc}" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1566492031773-4f4e44671857?q=80&w=300';" class="player-avatar" alt="${p.name}">
                        <div class="player-name">${p.name}</div>
                        <div class="player-role-badge"><i class="fa-solid fa-shield-halved"></i> ${roleTitle}</div>

                        <div class="info-list">
                            <div class="info-item">
                                <span><i class="fa-solid fa-gamepad"></i> Game ID:</span>
                                <span class="val">${p.gameId || 'N/A'}</span>
                            </div>
                            <div class="info-item">
                                <span><i class="fa-solid fa-mobile-screen-button"></i> Device:</span>
                                <span class="val">${p.device || 'N/A'}</span>
                            </div>
                            <div class="info-item">
                                <span><i class="fa-brands fa-facebook"></i> FB Profile:</span>
                                <a href="${fbUrl}" target="_blank" class="fb-btn">Visit Profile <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:10px;"></i></a>
                            </div>
                        </div>

                        <div class="recent-results-wrapper">
                            <span class="results-label">Recent Match Form</span>
                            <div class="results-boxes">
                                ${formBadgesHtml}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // REAL-TIME SEARCH FILTER FUNCTION
        function filterPlayers() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.querySelectorAll('.player-card');

            cards.forEach(card => {
                let text = card.innerText.toLowerCase();
                if (text.includes(input)) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            });
        }
    </script>
</body>
</html>
