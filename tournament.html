<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournaments & Hall of Fame | East Bengal eFootball Club</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Teko:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        :root {
            --bg-dark: #0a0a0c;
            --bg-card: #121318;
            --primary-red: #e50914;
            --primary-red-hover: #b80710;
            --accent-gold: #ffb703;
            --accent-green: #4caf50;
            --text-light: #ffffff;
            --text-muted: #9a9caf;
            --border-color: #22242d;
            --glow-red: rgba(229, 9, 20, 0.4);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding-bottom: 60px;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(10, 10, 12, 0.95);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

            .brand-logo .logo-img {
                width: 45px;
                height: 45px;
                object-fit: contain;
                border-radius: 6px;
                box-shadow: 0 0 12px rgba(255, 183, 3, 0.4);
            }

            .brand-logo .brand-name {
                font-family: 'Teko', sans-serif;
                font-size: 26px;
                letter-spacing: 1px;
                text-transform: uppercase;
            }

                .brand-logo .brand-name span {
                    color: var(--primary-red);
                }

        .btn-outline-sm {
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-light);
            padding: 6px 16px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s ease;
            font-size: 13px;
        }

            .btn-outline-sm:hover {
                border-color: var(--primary-red);
                color: var(--primary-red);
            }

        /* MAIN CONTAINER */
        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

            .page-header h1 {
                font-family: 'Teko', sans-serif;
                font-size: 48px;
                text-transform: uppercase;
                line-height: 1;
            }

            .page-header p {
                color: var(--text-muted);
                font-size: 16px;
            }

        /* TOURNAMENT CARDS GRID */
        .tournament-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .tournament-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--accent-gold);
            border-radius: 12px;
            padding: 22px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: 0.3s ease;
        }

            .tournament-card:hover {
                transform: translateY(-5px);
                border-color: var(--accent-gold);
            }

        /* TOURNAMENT LOGO & TITLE HEADER */
        .t-card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .t-logo-img {
            width: 65px;
            height: 65px;
            object-fit: contain;
            border-radius: 8px;
            background: #090a0c;
            padding: 5px;
            border: 1px solid var(--border-color);
        }

        .t-header-info h3 {
            font-family: 'Teko', sans-serif;
            font-size: 28px;
            line-height: 1;
            text-transform: uppercase;
            color: var(--text-light);
        }

        .t-header-info .t-date {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
            display: block;
        }

        /* WINNERS SECTION */
        .winners-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .winner-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #090a0c;
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
        }

            .winner-row.champion-row {
                border-color: rgba(255, 183, 3, 0.4);
                background: linear-gradient(135deg, rgba(255, 183, 3, 0.08), rgba(9, 10, 12, 0.9));
            }

        .winner-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .winner-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
        }

        .winner-row.champion-row .winner-avatar {
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px rgba(255, 183, 3, 0.4);
        }

        .winner-details .badge-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .champion-row .badge-label {
            color: var(--accent-gold);
        }

        .runnerup-row .badge-label {
            color: var(--text-muted);
        }

        .winner-details .p-name {
            font-weight: 700;
            font-size: 16px;
            color: var(--text-light);
        }

        .trophy-icon {
            font-size: 22px;
        }

        .champion-row .trophy-icon {
            color: var(--accent-gold);
        }

        .runnerup-row .trophy-icon {
            color: #c0c0c0;
        }
    </style>

    <!-- FIREBASE COMPAT SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBETAOmBVsmFiI_HvKyk7_QKDBCMNKoUL0",
            authDomain: "ebfc-portal.firebaseapp.com",
            projectId: "ebfc-portal",
            storageBucket: "ebfc-portal.firebasestorage.app",
            messagingSenderId: "93840741420",
            appId: "1:93840741420:web:05d574c95368be68e62d89",
            measurementId: "G-VBHEWLE64S"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="brand-logo">
            <img src="Image/image1.jpg.jpg" alt="EBFC Logo" class="logo-img" onerror="this.onerror=null; this.src='image1.jpg.jpg';">
            <div class="brand-name">EB <span>FC</span></div>
        </div>
        <div>
            <a href="home.html" class="btn-outline-sm"><i class="fa-solid fa-house"></i> Home</a>
        </div>
    </nav>

    <div class="container">

        <div class="page-header">
            <h1>EBFC Past Tournaments</h1>
            <p>Historic Competitions, Champions & Honor Roll</p>
        </div>

        <!-- DYNAMIC TOURNAMENT HISTORY CARDS GRID FROM FIREBASE -->
        <div class="tournament-grid" id="pastTournamentsGrid"></div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            listenToPastTournaments();
        });

        function listenToPastTournaments() {
            db.collection('past_tournaments').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                const grid = document.getElementById('pastTournamentsGrid');
                grid.innerHTML = '';

                if (snapshot.empty) {
                    grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">No historic tournaments found in database.</p>`;
                    return;
                }

                snapshot.forEach(doc => {
                    const t = doc.data();
                    const logoUrl = t.logo || 'Image/image1.jpg.jpg';
                    const champName = t.champion ? t.champion.name : 'Unknown';
                    const champAvatar = t.champion ? t.champion.avatar : 'Image/player1.webp';
                    const runnerName = t.runnerup ? t.runnerup.name : 'Unknown';
                    const runnerAvatar = t.runnerup ? t.runnerup.avatar : 'Image/player1.webp';

                    grid.innerHTML += `
                            <div class="tournament-card">
                                <div class="t-card-header">
                                    <img src="${logoUrl}" alt="Logo" class="t-logo-img" onerror="this.onerror=null; this.src='Image/image1.jpg.jpg';">
                                    <div class="t-header-info">
                                        <h3>${t.title}</h3>
                                        <span class="t-date"><i class="fa-regular fa-calendar"></i> ${t.date}</span>
                                    </div>
                                </div>

                                <div class="winners-box">
                                    <!-- Champion -->
                                    <div class="winner-row champion-row">
                                        <div class="winner-profile">
                                            <img src="${champAvatar}" alt="Champion Avatar" class="winner-avatar" onerror="this.onerror=null; this.src='Image/player1.webp';">
                                            <div class="winner-details">
                                                <span class="badge-label"><i class="fa-solid fa-crown"></i> Champion</span>
                                                <div class="p-name">${champName}</div>
                                            </div>
                                        </div>
                                        <i class="fa-solid fa-trophy trophy-icon"></i>
                                    </div>

                                    <!-- Runner-Up -->
                                    <div class="winner-row runnerup-row">
                                        <div class="winner-profile">
                                            <img src="${runnerAvatar}" alt="Runner-Up Avatar" class="winner-avatar" onerror="this.onerror=null; this.src='Image/player1.webp';">
                                            <div class="winner-details">
                                                <span class="badge-label"><i class="fa-solid fa-medal"></i> Runner-Up</span>
                                                <div class="p-name">${runnerName}</div>
                                            </div>
                                        </div>
                                        <i class="fa-solid fa-award trophy-icon"></i>
                                    </div>
                                </div>
                            </div>`;
                });
            }, error => {
                console.error("Error loading past tournaments: ", error);
            });
        }
    </script>

</body>
</html>
