<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Registration | East Bengal eFootball Club</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Teko:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        :root {
            --bg-dark: #0a0a0c; --bg-card: #121318; --primary-red: #e50914;
            --primary-red-hover: #b80710; --accent-gold: #ffb703; --text-light: #ffffff;
            --text-muted: #9a9caf; --border-color: #22242d; --glow-red: rgba(229, 9, 20, 0.4);
        }
        body { background-color: var(--bg-dark); color: var(--text-light); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 30px 20px; }
        .reg-card { background: var(--bg-card); border: 1px solid var(--border-color); border-top: 3px solid var(--primary-red); border-radius: 8px; width: 100%; max-width: 500px; padding: 35px 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .reg-header { text-align: center; margin-bottom: 25px; }
        .brand-logo-img { width: 60px; height: 60px; object-fit: contain; border-radius: 8px; margin: 0 auto 12px auto; display: block; box-shadow: 0 0 15px rgba(255, 183, 3, 0.4); border: 1px solid rgba(255, 183, 3, 0.3); }
        .reg-header h1 { font-family: 'Teko', sans-serif; font-size: 36px; text-transform: uppercase; line-height: 1; }
        .reg-header p { color: var(--text-muted); font-size: 14px; margin-top: 5px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; text-transform: uppercase; color: var(--text-muted); }
        .form-control { width: 100%; background: #090a0c; border: 1px solid var(--border-color); padding: 11px 14px; color: var(--text-light); border-radius: 4px; font-size: 14px; outline: none; transition: 0.3s ease; }
        .form-control:focus { border-color: var(--primary-red); box-shadow: 0 0 10px var(--glow-red); }
        .btn-submit { width: 100%; background: var(--primary-red); color: #fff; padding: 12px; font-size: 16px; font-weight: 700; text-transform: uppercase; border: none; border-radius: 4px; cursor: pointer; transition: 0.3s ease; margin-top: 10px; }
        .btn-submit:hover { background: var(--primary-red-hover); box-shadow: 0 0 15px var(--glow-red); }
        .bottom-prompt { text-align: center; margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 14px; }
        .bottom-prompt a { color: var(--primary-red); font-weight: 700; text-decoration: none; }
    </style>

    <!-- FIREBASE COMPAT SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // ⚡ FIREBASE CONFIGURATION (EBFC PORTAL)
        const firebaseConfig = {
            apiKey: "AIzaSyBETAOmBVsmFiI_HvKyk7_QKdBCMNKoUL0",
            authDomain: "ebfc-portal.firebaseapp.com",
            projectId: "ebfc-portal",
            storageBucket: "ebfc-portal.firebasestorage.app",
            messagingSenderId: "93840741420",
            appId: "1:93840741420:web:05d574c95368be68e62d89",
            measurementId: "G-VBHEWLE64S"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
    </script>
</head>
<body>

    <div class="reg-card">
        <div class="reg-header">
            <img src="Image/image1.jpg.jpg" alt="EBFC Logo" class="brand-logo-img" onerror="this.onerror=null; this.src='image1.jpg.jpg';">
            <h1>Player Registration</h1>
            <p>Join East Bengal eFootball Club Official Roster</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> Full Name</label>
                <input type="text" id="regName" class="form-control" placeholder="e.g. Tawshik Ahammad Ayon" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" id="regEmail" class="form-control" placeholder="Enter valid email" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" id="regPassword" class="form-control" placeholder="Create strong password (min 6 chars)" minlength="6" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-gamepad"></i> eFootball Game ID / Username</label>
                <input type="text" id="regGameId" class="form-control" placeholder="e.g. ASEZ-334-526" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-mobile-screen-button"></i> Gaming Device</label>
                <input type="text" id="regDevice" class="form-control" placeholder="e.g. Redmi Note 12 Pro / iPhone 13" required>
            </div>

            <div class="form-group">
                <label><i class="fa-brands fa-facebook"></i> Facebook Profile URL</label>
                <input type="url" id="regFb" class="form-control" placeholder="https://facebook.com/your.profile" required>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Register Profile</button>
        </form>

        <div class="bottom-prompt">
            Already registered? <a href="login.html">Login Here</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Registering with Firebase...";

            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const gameId = document.getElementById('regGameId').value.trim();
            const device = document.getElementById('regDevice').value.trim();
            const fbLink = document.getElementById('regFb').value.trim();

            try {
                // 1. CREATE USER IN FIREBASE AUTHENTICATION
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const uid = userCredential.user.uid;

                // 2. STORE COMPLETE PLAYER PROFILE IN FIRESTORE DATABASE
                const playerProfile = {
                    uid: uid,
                    id: Date.now(), // Unique Numeric ID for tournament compatibility
                    name: name,
                    email: email,
                    gameId: gameId,
                    device: device,
                    fbLink: fbLink,
                    role: 'player', // Default role on registration
                    avatar: 'Image/player1.webp',
                    recentForm: ['W', 'W', 'W', 'D', 'W'],
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    official: { mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, winRate: "0.0", motm: 0 },
                    domestic: { mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, winRate: "0.0", motm: 0 },
                    potm: { mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, winRate: "0.0", motm: 0 }
                };

                await db.collection('users').doc(uid).set(playerProfile);

                alert("Registration Successful! Redirecting to login page...");
                window.location.href = "login.html";

            } catch (error) {
                console.error("Firebase Registration Error: ", error);
                alert("Error: " + error.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "Register Profile";
            }
        });
    </script>
</body>
</html>
